<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1b2a">
<title>LibreShard</title>
<link rel="icon" href="/brand/logo-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg:#0d1b2a; --cell:#13263a; --cell2:#1b324a; --line:#1f3a55;
    --text:#e6f1fa; --muted:#7ea3c2; --accent:#22d3ee; --gold:#fbbf24; --danger:#ff9a9a; --warn:#fbbf24;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px);
    --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font:16px system-ui, sans-serif; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  input { -webkit-user-select:text; user-select:text; }
  button { font:inherit; color:inherit; }
  [hidden] { display:none !important; }

  /* Main menu */
  #menu { height:100%; overflow-y:auto; padding:calc(var(--st) + 24px) calc(var(--sr) + 24px) calc(var(--sb) + 24px) calc(var(--sl) + 24px); }
  .menu-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:8px; margin:0 0 14px; font-size:15px; font-weight:700; letter-spacing:.08em; color:var(--accent); }
  .brand img { width:30px; height:30px; }
  .brand b { color:var(--gold); }
  #menu h1 { margin:0 0 4px; font-size:26px; font-weight:650; }
  #menu .sub { margin:0 0 22px; color:var(--muted); }
  #list { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
  #empty { color:var(--muted); max-width:46ch; line-height:1.5; }
  .card { display:grid; gap:6px; align-content:start; text-align:left; min-height:130px; padding:16px; background:var(--cell); border:1px solid var(--line); border-radius:16px; cursor:pointer; }
  .card:active { transform:scale(.98); border-color:var(--accent); }
  .card .name { margin-top:6px; font-size:18px; font-weight:600; }
  .card .meta { font-size:13px; color:var(--muted); }
  .card .desc { font-size:14px; color:#a9c0d3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .fs-btn { flex:none; display:flex; align-items:center; gap:8px; min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:12px; background:var(--cell); cursor:pointer; }
  .fs-btn:active { border-color:var(--accent); }
  .ico { width:44px; height:44px; border-radius:12px; background:var(--cell2); color:var(--accent); display:grid; place-items:center; font-size:24px; font-weight:600; }

  /* Full-screen shard */
  #stage { position:fixed; inset:0; background:var(--cell); }
  /* Zoom: the iframe gets smaller and is scaled up, so the shard reflows like with browser zoom */
  #frame { --zoom:1; width:calc(100% / var(--zoom)); height:calc(100% / var(--zoom)); border:0; display:block; transform:scale(var(--zoom)); transform-origin:0 0; }
  #fab {
    position:fixed; z-index:20; top:calc(var(--st) + 10px); left:calc(var(--sl) + 10px);
    width:44px; height:44px; display:grid; place-items:center; padding:0;
    border-radius:12px; border:1px solid rgba(255,255,255,.18);
    background:rgba(13,27,42,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    opacity:.4; transition:opacity .2s; cursor:pointer;
  }
  #fab:active, #fab[aria-expanded="true"] { opacity:1; }
  #scrim { position:fixed; inset:0; z-index:21; }
  #panel {
    position:fixed; z-index:22; top:calc(var(--st) + 62px); left:calc(var(--sl) + 10px);
    width:min(280px, calc(100vw - 20px)); max-height:calc(100% - var(--st) - 80px); overflow-y:auto;
    padding:8px; background:var(--cell); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 12px 32px rgba(0,0,0,.45);
  }
  .item { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:8px 12px; border:0; border-radius:10px; background:none; text-align:left; cursor:pointer; }
  .item:active { background:var(--cell2); }
  .item .ico { width:30px; height:30px; border-radius:8px; font-size:17px; flex:none; }
  .sep { height:1px; background:var(--line); margin:6px 4px; }
  .hd { margin:6px 12px 2px; font-size:13px; color:var(--muted); }
  .zoom { display:flex; align-items:center; gap:8px; min-height:48px; padding:4px 4px 4px 12px; }
  .zoom .zl { flex:1; display:flex; align-items:center; gap:12px; }
  .zoom button { width:44px; height:40px; border:1px solid var(--line); border-radius:10px; background:var(--cell2); font-size:20px; cursor:pointer; }
  .zoom button:active { border-color:var(--accent); }
  .zoom button:disabled { opacity:.35; }
  .zoom output { min-width:4.5ch; text-align:center; font-variant-numeric:tabular-nums; }

  /* Connection status */
  #offline { position:fixed; z-index:30; left:50%; bottom:calc(var(--sb) + 16px); transform:translateX(-50%); padding:10px 16px; border-radius:999px; background:var(--cell2); border:1px solid var(--line); color:var(--danger); font-size:14px; }

  #paused { position:fixed; z-index:29; top:calc(var(--st) + 10px); left:50%; transform:translateX(-50%); padding:8px 16px; border-radius:999px; background:var(--gold); color:var(--bg); font-size:14px; font-weight:600; pointer-events:none; }
  .card .meta.warn { color:var(--gold); }
  .card { position:relative; }
  .card .fav { position:absolute; top:12px; right:14px; color:var(--gold); font-size:20px; }
  /* At the top: with Chrome's per-site zoom on Android, elements fixed to the bottom end up outside the visible area */
  body.toasting #focusbar { visibility:hidden; }
  #focusbar { position:fixed; z-index:28; left:50%; top:calc(var(--st) + 12px); transform:translateX(-50%); max-width:min(560px, calc(100vw - 140px)); padding:8px 16px; border-radius:999px; background:rgba(13,27,42,.88); border:1px solid var(--gold); color:var(--gold); font-size:14px; text-align:center; pointer-events:none; }
  #toast { position:fixed; z-index:30; top:calc(var(--st) + 12px); left:50%; transform:translateX(-50%); max-width:min(480px, 80vw); padding:12px 16px; border-radius:12px; background:var(--cell2); border:1px solid var(--warn); font-size:14px; line-height:1.4; text-align:center; }
  /* The shard iframe runs in its own process. On Android Chrome, taps on an element drawn over it
     only reach that element if it has its own compositing layer; otherwise they fall through to
     the shard. will-change gives the overlays one. */
  #toast, #fab { will-change: transform; }
  .toast-action { display:block; margin:10px auto 0; padding:10px 14px; min-height:44px; border:0; border-radius:10px; background:var(--accent); color:var(--bg); font-weight:600; cursor:pointer; }

  /* PIN screen */
  #lock { position:fixed; inset:0; z-index:40; display:none; place-items:center; background:var(--bg); }
  #lock.on { display:grid; }
  #lock form { display:grid; gap:12px; width:min(300px, 80vw); }
  #lock .logo { width:96px; height:96px; justify-self:center; }
  #lock input { font-size:28px; letter-spacing:.3em; text-align:center; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--cell); color:var(--text); }
  #lock button { font-size:18px; padding:12px; border:0; border-radius:10px; background:var(--accent); color:var(--bg); font-weight:600; }
  #msg { color:var(--danger); min-height:1.2em; text-align:center; margin:0; }
</style>
</head>
<body>

<main id="menu">
  <header class="menu-head">
    <div>
      <div class="brand"><img src="/brand/logo-mark.svg" alt=""><span>LIBRE<b>SHARD</b></span></div>
      <h1 data-i18n="viewer.title"></h1>
      <p class="sub" data-i18n="viewer.subtitle"></p>
    </div>
    <button id="fsMenu" class="fs-btn" hidden></button>
  </header>
  <div id="list"></div>
  <p id="empty" hidden></p>
</main>

<div id="stage" hidden>
  <iframe id="frame" sandbox="allow-scripts" title="Shard"></iframe>
  <button id="fab" data-i18n-aria="viewer.openMenu" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
    </svg>
  </button>
  <div id="scrim" hidden></div>
  <div id="panel" hidden></div>
</div>

<div id="paused" hidden data-i18n="viewer.paused"></div>
<div id="focusbar" hidden></div>
<div id="offline" hidden data-i18n="viewer.offline"></div>
<div id="toast" role="status" hidden></div>

<div id="lock">
  <form id="pairForm">
    <img class="logo" src="/brand/logo-mark.svg" alt="LibreShard">
    <p style="margin:0;text-align:center" data-i18n="viewer.pairPrompt"></p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-i18n-aria="viewer.codeLabel">
    <button data-i18n="viewer.pair"></button>
    <p id="msg"></p>
  </form>
</div>

<script src="/app.js"></script>
</body>
</html>
