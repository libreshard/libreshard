name: Website

# libreshard.com offers the release GitHub marks "Latest" (never a draft or a pre-release), read
# when the site is built. "released" fires exactly when a version becomes that release: published
# as a release, or a pre-release promoted after its testing period ("published" would also fire for
# pre-releases, and not on the promotion). The rebuild goes through a Cloudflare Pages deploy hook
# whose URL is the repository secret WEBSITE_DEPLOY_HOOK. It can also be run by hand from Actions.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    name: Rebuild the website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::WEBSITE_DEPLOY_HOOK isn't set: the website wasn't rebuilt"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "The website is rebuilding."
